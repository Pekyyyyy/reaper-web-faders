<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>REAPER Faders</title>
<script src="main.js"></script>
<style>
  :root {
    --bg: #17191c; --panel: #212429; --panel2: #2a2e34; --line: #33383f;
    --text: #e6e8eb; --dim: #8b929b; --accent: #4fa3ff;
    --rec: #ff3b3b; --mute: #e5484d; --solo: #f5c518; --ok: #3fd17a; --arm: #ff5a5a; --fx: #4fa3ff;
    --graph: #101215; --grid: #23272d; --curve: #59b6ff; --comp: #ffb347;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  button, select { font: inherit; color: inherit; border: 1px solid var(--line); background: var(--panel2);
    border-radius: 6px; padding: 0; cursor: pointer; touch-action: manipulation; }
  button:active { filter: brightness(1.3); }
  canvas { display: block; width: 100%; }

  /* ---------- transport bar ---------- */
  #bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
  .tbtn svg { width: 22px; height: 22px; fill: currentColor; }
  #recBtn { width: 58px; height: 58px; border: 2px solid #5a2a2a; }
  #recBtn .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--rec); opacity: .55; }
  #recBtn.on { background: var(--rec); border-color: var(--rec); animation: pulse 1.2s infinite; }
  #recBtn.on .dot { background: #fff; opacity: 1; border-radius: 4px; width: 20px; height: 20px; }
  #playBtn.on { background: #1f5f38; border-color: var(--ok); color: #bff5d2; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(255,59,59,.25); } }
  #clock { display: flex; flex-direction: column; min-width: 150px; }
  #time { font: 600 30px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1px; }
  #time.rec { color: var(--rec); }
  #sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  #state { font-weight: 700; }
  #state.rec { color: var(--rec); }
  .spacer { flex: 1; }
  #hiddenBtn { padding: 8px 12px; font-size: 13px; }
  #hiddenBtn.on { border-color: var(--accent); color: var(--accent); }
  #bridge { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #bridge i { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block; }
  #bridge.ok i { background: var(--ok); }

  /* ---------- strips ---------- */
  #mixer { display: flex; gap: 8px; padding: 12px 16px 24px; overflow-x: auto; align-items: stretch;
    -webkit-overflow-scrolling: touch; }
  .strip { flex: 0 0 var(--stripW, 172px); min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; gap: 8px; padding: 8px; position: relative; }
  .strip.master { border-color: #46505c; }
  .strip.hidden { opacity: .45; }
  .strip.hidden .hideBtn { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .name { font-weight: 700; text-align: center; padding: 6px 4px; border-radius: 6px; background: var(--panel2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 3px solid transparent; }
  .tools { display: flex; justify-content: flex-end; gap: 2px; margin: -2px -2px 0 0; }
  .hideBtn { width: 26px; height: 26px; border-radius: 6px;
    background: transparent; border-color: transparent; opacity: .6; display: grid; place-items: center; }
  .hideBtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

  .fxbox { display: flex; flex-direction: column; gap: 6px; min-height: 30px; }
  .mini { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    background: var(--graph); cursor: pointer; }
  .mini canvas { height: 50px; }
  .minis { display: flex; gap: 4px; flex-wrap: wrap; align-items: stretch; }
  .top { display: flex; flex-direction: column; gap: 8px; }
  .top .fxbox { flex: 1; }
  .minis .mini.eq { flex: 1 1 44px; min-width: 44px; }
  .compgrp { flex: 0 0 auto; display: flex; gap: 3px; align-items: center; }
  .mini.comp { width: 48px; flex: 0 0 48px; }
  .mini.comp .lbl { display: none; }
  .mini .pwr { height: 15px; font-size: 8px; padding: 0 3px; }
  .knob.sm svg { width: 34px; height: 34px; }
  .knob.sm .kv { font-size: 9px; }
  .knob.sm .kl { font-size: 9px; max-width: 40px; }
  .knob.sm { gap: 0; }
  .mini .lbl { position: absolute; left: 5px; top: 3px; font-size: 10px; font-weight: 700; color: var(--dim);
    letter-spacing: .5px; pointer-events: none; }
  .mini .pwr { position: absolute; right: 3px; top: 3px; height: 18px; padding: 0 5px; font-size: 9px; font-weight: 700;
    color: var(--fx); background: rgba(16,18,21,.8); border-color: #2c4560; }
  .mini.off .pwr { color: var(--dim); border-color: var(--line); }
  .mini.off canvas { opacity: .35; }
  .fxrow { display: flex; gap: 4px; }
  .fxname { flex: 1; text-align: left; padding: 6px 7px; font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; background: #1d2a3a; border-color: #2c4560; }
  .fxrow.off .fxname { background: var(--panel2); border-color: var(--line); color: var(--dim); text-decoration: line-through; }
  .fxon { width: 34px; font-size: 10px; font-weight: 700; color: var(--fx); }
  .fxrow.off .fxon { color: var(--dim); }
  .nofx { color: var(--dim); font-size: 11px; text-align: center; padding: 6px 0; }
  .fxall { font-size: 11px; padding: 4px; color: var(--dim); }
  .fxall.off { color: var(--mute); border-color: var(--mute); }

  .knobrow { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .knobrow input { flex: 1; min-width: 0; }
  .knobrow span { width: 40px; text-align: right; color: var(--text); }

  .faderwrap { display: flex; gap: 4px; height: 220px; justify-content: center; }
  .fader { position: relative; width: 46px; touch-action: none; cursor: ns-resize; }
  .fader .track { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 6px; margin-left: -3px;
    background: #0e1012; border-radius: 3px; }
  .fader .zero { position: absolute; left: 4px; right: 4px; height: 1px; background: #555d66; }
  .strip:not(.no-fscale) .fader .zero { display: none; }   /* the scale's 0 dB mark replaces it */
  .fader .ft { position: absolute; left: 0; right: 0; height: 0; pointer-events: none; }
  .fader .ft span { position: absolute; left: 0; width: 15px; text-align: right; transform: translateY(-50%);
    font: 8px/1 ui-monospace, Menlo, monospace; color: #6b737d; }
  .fader .ft i { position: absolute; top: 0; height: 1px; background: #3a414a; width: 4px; }
  .fader .ft i.l { left: calc(50% - 9px); }
  .fader .ft i.r { left: calc(50% + 5px); }
  .fader .ft.z span { color: #aab2bb; }
  .fader .ft.z i { background: #6b737d; width: 6px; }
  .fader .ft.z i.l { left: calc(50% - 11px); }
  .fader .cap { position: absolute; left: 3px; right: 3px; height: 22px; margin-top: -11px; border-radius: 4px;
    background: linear-gradient(#6b737d, #3b4148); border: 1px solid #222; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .fader .cap::after { content: ""; position: absolute; left: 4px; right: 4px; top: 10px; height: 2px; background: #ddd; }
  .meter { width: 12px; background: #0e1012; border-radius: 3px; position: relative; overflow: hidden; margin: 10px 0; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(to top, #2fbf5f 0%, #2fbf5f 58%, #e8c33a 61%, #e8c33a 84%, #ff4040 86%); background-size: 100% 200px; z-index: 0;
    background-position: bottom; }
  .db { text-align: center; font: 600 13px ui-monospace, Menlo, monospace; }
  .db.clip { color: var(--rec); }
  .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .btns button { height: 32px; font-weight: 700; font-size: 12px; }
  .btns .m.on { background: var(--mute); color: #fff; border-color: var(--mute); }
  .btns .s.on { background: var(--solo); color: #222; border-color: var(--solo); }
  .btns .r.on { background: var(--arm); color: #fff; border-color: var(--arm); }
  .btns .mon.on { background: #6a5cff; color: #fff; border-color: #6a5cff; }
  .btns { grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  .sect2 { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .sect2 > button { background: transparent; border: 0; text-align: left; font-size: 11px; color: var(--dim);
    text-transform: uppercase; letter-spacing: .6px; padding: 2px 0; display: flex; gap: 6px; align-items: center; }
  .sect2 > button::before { content: "▸"; display: inline-block; transition: transform .15s; }
  .sect2.open > button::before { transform: rotate(90deg); }
  .sect2 .list { display: none; flex-direction: column; gap: 4px; }
  .sect2.open .list { display: flex; }
  .sendrow { display: flex; flex-direction: column; gap: 0; padding: 5px 6px 2px; background: var(--panel2);
    border-radius: 6px; }
  .sendrow .r1, .sendrow .r2 { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .sendrow .lbl { flex: 1; min-width: 0; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sendrow .ch { color: var(--dim); font: 10px ui-monospace, Menlo, monospace; white-space: nowrap; }
  .sendrow .mute { flex: 0 0 22px; height: 20px; font-size: 10px; font-weight: 700; padding: 0; }
  .sendrow .mute.on { background: var(--mute); color: #fff; border-color: var(--mute); }
  .sendrow.muted .lbl, .sendrow.muted .v { opacity: .5; }
  .sendrow input { flex: 1; min-width: 0; }
  .sendrow .v { width: 36px; text-align: right; color: var(--text); font: 11px ui-monospace, Menlo, monospace; }

  .strip.no-pan .opt-pan, .strip.no-arm .opt-arm, .strip.no-mon .opt-mon, .strip.no-sends .opt-sends,
  .strip.no-recv .opt-recv, .strip.no-fx .opt-fx, .strip.no-scale .opt-scale,
  .strip.no-fscale .opt-fscale { display: none !important; }
  .strip.no-eq .mini.eq, .strip.no-comp .compgrp { display: none !important; }
  .strip.eqrow .minis .mini.eq { flex-basis: 100%; }
  .strip.eqrow .minis .mini.eq canvas { height: 56px; }
  .strip.webhidden { opacity: .45; outline: 1px dashed var(--line); }

  #banks { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #banks button { border: 0; border-radius: 0; padding: 8px 13px; font-size: 13px; font-weight: 700; background: var(--panel2); color: var(--dim); }
  #banks button + button { border-left: 1px solid var(--line); }
  #banks button.on { background: var(--accent); color: #fff; }
  #banks span { align-self: center; padding: 0 8px; font-size: 11px; color: var(--dim); }
  .cfgBtn { width: 26px; height: 26px; border-radius: 6px; font-size: 14px;
    background: transparent; border-color: transparent; opacity: .6; display: grid; place-items: center; }
  .cfgBtn.custom { color: var(--accent); opacity: 1; }
  #stripMenu { position: fixed; z-index: 15; display: none; min-width: 210px; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #stripMenu.open { display: block; }
  #stripMenu .ttl { padding: 6px 10px; font-size: 12px; color: var(--dim); }
  #stripMenu label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
  #stripMenu label:hover { background: #343a42; }
  #stripMenu label.ovr { color: var(--accent); }
  #stripMenu input { width: 18px; height: 18px; accent-color: var(--accent); }
  #stripMenu button, #viewMenu .mbtn { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-top: 4px; font-size: 13px; }
  #viewMenu .ttl { padding: 6px 10px; font-size: 12px; color: var(--dim); }

  #viewWrap { position: relative; }
  #viewBtn { padding: 8px 12px; font-size: 13px; }
  #viewMenu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; display: none; min-width: 210px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #viewMenu.open { display: block; }
  #viewMenu label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  #viewMenu label:hover { background: #343a42; }
  #viewMenu input { width: 18px; height: 18px; accent-color: var(--accent); }
  #viewMenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #viewMenu .wrow { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; }
  #viewMenu .wrow input { flex: 1; width: auto; height: 22px; }

  .scale { position: relative; width: 22px; margin: 10px 0; font: 9px/1 ui-monospace, Menlo, monospace; color: #6b737d; }
  .scale span { position: absolute; right: 0; transform: translateY(-50%); }
  .meter b { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.14); z-index: 1; }
  .meter b.z { background: rgba(255,255,255,.35); }
  .pk { text-align: center; font: 10px ui-monospace, Menlo, monospace; color: var(--dim); margin-top: -4px; }
  .pk.clip { color: var(--rec); }

  input[type=range] { -webkit-appearance: none; appearance: none; height: 22px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #0e1012; border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: #9aa3ad; margin-top: -6px; }
  input[type=range]::-moz-range-track { height: 4px; background: #0e1012; border-radius: 2px; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #9aa3ad; border: 0; }

  /* ---------- FX popup ---------- */
  #modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); padding: 16px; }
  #modal.open { display: flex; }
  #card { position: relative; width: 100%; max-width: 1040px; max-height: 100%; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.7);
    overflow: hidden; }
  #cardHead { display: flex; align-items: center; gap: 8px; padding: 12px 60px 12px 16px; border-bottom: 1px solid var(--line); }
  #cardTitle { flex: 1; font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cardTitle small { color: var(--dim); font-weight: 400; margin-left: 8px; font-size: 13px; }
  #cardHead button { padding: 7px 12px; font-size: 13px; }
  #cardOn.on { color: var(--fx); border-color: var(--fx); }
  #closeX { position: absolute; top: 8px; right: 10px; width: 40px; height: 40px; border-radius: 50%; font-size: 24px;
    line-height: 1; background: transparent; border-color: transparent; color: var(--dim); }
  #closeX:hover { color: var(--text); background: var(--panel2); }
  #cardBody { display: flex; gap: 16px; padding: 16px; overflow: auto; }
  #graphCol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #graphBox { position: relative; background: var(--graph); border: 1px solid var(--line); border-radius: 8px; }
  #graph { height: 340px; touch-action: none; }
  #ctrlCol { flex: 0 0 300px; display: flex; flex-direction: column; gap: 10px; }
  .bands { display: flex; gap: 6px; flex-wrap: wrap; }
  .band { padding: 6px 10px; font-size: 12px; font-weight: 700; border-width: 2px; }
  .band.off { opacity: .45; }
  .band.sel { background: #343a42; }
  .ctrlhead { display: flex; gap: 8px; align-items: center; }
  .ctrlhead select { flex: 1; padding: 7px 8px; font-size: 13px; }
  .ctrlhead button { padding: 7px 10px; font-size: 13px; }
  .ctrlhead button.on { color: var(--ok); border-color: var(--ok); }
  .sect { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-top: 4px; }
  .knobs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; }
  .knob { display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; cursor: ns-resize; }
  .knob svg { width: 62px; height: 62px; }
  .knob .kl { font-size: 11px; color: var(--dim); text-align: center; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 90px; }
  .knob .kv { font: 600 12px ui-monospace, Menlo, monospace; }
  .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggles button { padding: 6px 10px; font-size: 12px; }
  .toggles button.on { color: var(--comp); border-color: var(--comp); }
  .hint { font-size: 11px; color: var(--dim); }
  #params { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 20px; width: 100%; }
  .prm { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 8px; padding: 4px 0; }
  .prm label { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prm b { font: 600 12px ui-monospace, Menlo, monospace; }
  .prm input { grid-column: 1 / 3; width: 100%; }

  @media (max-width: 760px) {
    #modal { padding: 0; align-items: stretch; }
    #card { border-radius: 0; max-height: none; height: 100%; }
    #cardBody { flex-direction: column; }
    #ctrlCol { flex-basis: auto; }
    #graph { height: 240px; }
    #cardHead { flex-wrap: wrap; }
  }
  @media (max-width: 600px) {
    #bar { gap: 8px; }
    #clock { order: -1; flex-basis: 100%; flex-direction: row; align-items: baseline; gap: 10px; }
    #time { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="bar">
  <button id="recBtn" class="tbtn" title="Record / stop"><span class="dot"></span></button>
  <button id="playBtn" class="tbtn" title="Play / pause"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
  <button id="stopBtn" class="tbtn" title="Stop"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/></svg></button>
  <div id="clock">
    <div id="time">0:00:00.0</div>
    <div id="sub"><span id="state">STOPPED</span> · <span id="posStr">1.1.00</span></div>
  </div>
  <div class="spacer"></div>
  <div id="banks" title="View banks: which items each strip shows (saved in REAPER)"></div>
  <div id="bridge" title="FX bridge script (web_fx_bridge.lua) status"><i></i><span>FX bridge</span> <span id="srate"></span></div>
  <button id="hiddenBtn">Show hidden</button>
  <div id="viewWrap">
    <button id="viewBtn">View ▾</button>
    <div id="viewMenu"></div>
  </div>
</div>

<div id="mixer"></div>
<div id="stripMenu"></div>

<div id="modal">
  <div id="card">
    <div id="cardHead">
      <div id="cardTitle"></div>
      <button id="cardOn">ON</button>
      <button id="cardFloat" title="Open the plug-in window in REAPER">Open in REAPER</button>
    </div>
    <button id="closeX" title="Close">&times;</button>
    <div id="cardBody"></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------- polling
wwr_req_recur("TRANSPORT;NTRACK;TRACK", 60);
wwr_req_recur("GET/EXTSTATE/WEBFX/alive;GET/EXTSTATE/WEBFX/state", 150);
wwr_req_recur("GET/EXTSTATE/WEBFX/lut", 3000);
wwr_req_recur("GET/EXTSTATE/WEBFX/srate", 1000);
wwr_start();

var $ = function (id) { return document.getElementById(id); };
var tracks = {};          // idx -> {name, flags, vol, pan, peak, sendcnt, color}
var strips = {};          // idx -> DOM refs
var sends = {};           // "t/s" -> {vol, mute, dest}
var fxState = {};         // idx -> {v, ce, fx:[...]} from bridge
var luts = {};            // fx guid -> {param: [129 numeric samples]}
var bridgeAlive = "", bridgeSeen = 0, bridgeOk = false;
var nativeVis = {};       // idx -> visible (fallback when bridge isn't running)
var playstate = 0, showHidden = false, layoutSig = "";
var pend = {};            // key -> {v, until}: value set from this page, shown until REAPER reports it back

try { showHidden = localStorage.getItem("faders.showHidden") === "1"; } catch (e) {}

// ---------------------------------------------------------------- helpers
// fader position 0..1 <-> gain, top = +12 dB, 0 dB at ~71%
function pos2vol(p) { return p <= 0 ? 0 : 4 * Math.pow(p, 4); }
function vol2pos(v) { return v <= 0 ? 0 : Math.min(1, Math.pow(v / 4, 0.25)); }
function dbstr(v) {
  if (v < 0.0000001) return "-inf";
  var d = 20 * Math.log(v) / Math.LN10;
  if (Math.abs(d) < 0.05) return "0.0";
  return (d > 0 ? "+" : "") + d.toFixed(1);
}
// Optimistic values: a poll that was already in flight would otherwise briefly show the old value
// (new -> old -> new). Keep ours until the server agrees, or give up after 3 s.
function setPend(k, v) { pend[k] = { v: v, until: Date.now() + 3000 }; }
function isPend(k) { return !!pend[k]; }
function resolve(k, server, tol) {

    row.appendChild(r1); row.appendChild(r2);
    list.appendChild(row);
    var o = { row: row, lbl: lbl, ch: ch, r: r, v: v, k: k, mute: mute, recv: kind === "r" };
    guardDrag(r, o);
    s.sends.push(o);
  })(kind === "s" ? n : -(n + 1));
  return sec;
}

// fader scale marks (dB); positioned with the same curve the fader uses
var FADER_TICKS = [12, 6, 0, -6, -12, -24, -40, -60, -Infinity];

// meter scale: -60..+6 dBFS, with more room at the top
var METER_TICKS = [6, 0, -6, -12, -18, -24, -36, -48, -60];
function meterPos(db) { return db <= -60 ? 0 : Math.min(1, Math.pow((db + 60) / 66, 1.6)); }

function attachFader(s, onVol, getVol) {
  var dragging = false, startY = 0, startPos = 0, lastTap = 0;
  function h() { return s.fader.clientHeight - 20; }
  s.fader.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    var now = Date.now();
    if (now - lastTap < 300) { setPos(vol2pos(1)); lastTap = 0; return; }   // double tap -> 0 dB
    lastTap = now;
    dragging = true; startY = e.clientY; startPos = vol2pos(getVol());
    s.fader.setPointerCapture(e.pointerId);
  });
  s.fader.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    setPos(startPos + (startY - e.clientY) / h() * (e.shiftKey ? 0.25 : 1));
  });
  function end() { dragging = false; }
  s.fader.addEventListener("pointerup", end);
  s.fader.addEventListener("pointercancel", end);
  function setPos(p) {
    var v = pos2vol(clamp(p, 0, 1));
    s.dragVol = v;
    onVol(v);
    drawFader(s, v);
  }
}
function drawFader(s, v) {
  var h = s.fader.clientHeight - 20;
  s.cap.style.top = (10 + (1 - vol2pos(v)) * h) + "px";
  s.zero.style.top = (10 + (1 - vol2pos(1)) * h) + "px";
  if (s.fticksH !== h) {   // only when the fader height changes
    s.fticksH = h;
    s.fticks.forEach(function (t) {
      var d = +t.getAttribute("data-db");
      t.style.top = (10 + (1 - vol2pos(d === -Infinity ? 0 : Math.pow(10, d / 20))) * h) + "px";
    });
  }
  s.db.textContent = dbstr(v) + " dB";
}

function updateStrip(i) {
  var s = strips[i], t = tracks[i];
  if (!s || !t) return;
  var vis = isVisible(i);
  setCls(s.root, "strip" + (i == 0 ? " master" : "") + (vis ? "" : " hidden") + stripCls(i));
  setCls(s.cfg, "cfgBtn" + (bankObj().tr[trKey(i)] ? " custom" : ""));
  if (s.hide) { setHtml(s.hide, vis ? EYE : EYE_OFF); setTitle(s.hide, vis ? "Hide track in REAPER" : "Unhide track"); }
  s.name.style.borderTopColor = trackColor(t.color) || "transparent";

  drawFader(s, resolve("vol" + i, t.vol, Math.max(1e-6, t.vol * 0.001)));
  var pk = t.peak / 10; // dBFS
  s.meterBar.style.height = (meterPos(pk) * 100) + "%";
  if (pk > s.peakHold) s.peakHold = pk;
  setTxt(s.pk, s.peakHold <= -149 ? "peak -inf" : "peak " + (s.peakHold > 0 ? "+" : "") + s.peakHold.toFixed(1));
  setCls(s.pk, "pk opt-scale" + (s.peakHold > 0 ? " clip" : ""));

  var pan = resolve("pan" + i, t.pan, 0.006);
  if (!s.panDrag) { s.pan.value = pan; setTxt(s.panTxt, mkpanstr(pan)); }
  setCls(s.m, "m" + (t.flags & 8 ? " on" : ""));
  setCls(s.so, "s" + (t.flags & 16 ? " on" : ""));
  if (s.r) setCls(s.r, "r opt-arm" + (t.flags & 64 ? " on" : ""));
  if (s.mon) { setCls(s.mon, "mon opt-mon" + (t.flags & 384 ? " on" : "")); setTxt(s.mon, t.flags & 256 ? "A" : "◉"); }

  var fxs = fxState[i] ? fxState[i].fx : [];
  s.fxitems.forEach(function (item, fi) {
    var f = fxs[fi];
    if (!f) return;
    var off = !f.e;
    setCls(item, (item.kind ? "mini " + item.kind : "fxrow opt-fx") + (off ? " off" : ""));
    setTxt(item.pwr, off ? "OFF" : "ON");
    if (item.kind === "eq") drawEq(item.cv, i, fi);
    else if (item.kind === "comp") { drawComp(item.cv, i, fi); if (item.knob) item.knob.update(); }
  });
  if (s.fxall) {
    var chainOff = fxState[i] && fxState[i].ce === 0;
    setCls(s.fxall, "fxall opt-fx" + (chainOff ? " off" : ""));
    setTxt(s.fxall, chainOff ? "FX chain BYPASSED" : "FX chain ON");
  }

  s.sends.forEach(function (o) {
    var sd = sends[i + "/" + o.k];
    if (!sd) return;
    setTxt(o.lbl, (o.recv ? "← " : "→ ") + (sd.dest < 0 ? "HW out" : trackName(sd.dest)));
    // channel routing from the bridge: "src>dst", 1-based; receives list the source track's channels first
    var rt = fxState[i] && (o.recv ? fxState[i].rc : fxState[i].sd), spec = rt && rt[o.recv ? -o.k - 1 : o.k];
    if (spec) {
      var pr = spec.split(">");
      setTxt(o.ch, "ch " + pr[0] + " → " + pr[1]);
      setTitle(o.ch, o.recv ? "Source track channels " + pr[0] + " into this track's channels " + pr[1]
        : "This track's channels " + pr[0] + " into " + (sd.dest < 0 ? "hardware outputs " : "channels ") + pr[1]);
    } else setTxt(o.ch, "");
    setTitle(o.lbl, o.lbl.textContent + (o.ch.title ? " — " + o.ch.title : ""));
    setCls(o.mute, "mute" + (sd.mute ? " on" : ""));
    setCls(o.row, "sendrow" + (sd.mute ? " muted" : ""));
    var sv = resolve("send" + i + "/" + o.k, sd.vol, Math.max(1e-6, sd.vol * 0.001));
    if (!o.drag) { o.r.value = vol2pos(sv); setTxt(o.v, dbstr(sv)); }
  });
}

function toggleFx(t, f) {
  var fx = getFx(t, f);
  if (!fx) return;
  fx.e = fx.e ? 0 : 1;
  setPend("fxe" + t + "/" + f, fx.e);
  bridgeCmd("b|" + t + "|" + f + "|" + fx.e);
  render();
}

// redraw the minis/popup immediately when this page changes a value
function onLocalChange(t, f) {
  var s = strips[t];
  if (s && s.fxitems[f] && s.fxitems[f].kind === "eq") drawEq(s.fxitems[f].cv, t, f);
  if (s && s.fxitems[f] && s.fxitems[f].kind === "comp") { drawComp(s.fxitems[f].cv, t, f); if (s.fxitems[f].knob) s.fxitems[f].knob.update(); }
  if (popup && popup.t === t && popup.f === f) updatePopup();
}

// ---------------------------------------------------------------- knob
function makeKnob(label, t, f, p, opts) {
  var k = el("div", "knob" + (opts && opts.small ? " sm" : ""));
  k.innerHTML = '<svg viewBox="0 0 64 64"><path class="bg" fill="none" stroke="#0e1012" stroke-width="6" stroke-linecap="round"/>' +
    '<path class="val" fill="none" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="32" r="19" fill="#343a42"/>' +
    '<line class="ptr" x1="32" y1="32" x2="32" y2="17" stroke="#e6e8eb" stroke-width="3" stroke-linecap="round"/></svg>' +
    '<div class="kv"></div><div class="kl">' + esc(label) + "</div>";
  var color = (opts && opts.color) || "#59b6ff";
  var bg = k.querySelector(".bg"), val = k.querySelector(".val"), ptr = k.querySelector(".ptr"), kv = k.querySelector(".kv");
  val.setAttribute("stroke", color);
  function arc(a0, a1) {
    var r = 26, x0 = 32 + r * Math.sin(a0), y0 = 32 - r * Math.cos(a0), x1 = 32 + r * Math.sin(a1), y1 = 32 - r * Math.cos(a1);
    return "M" + x0 + " " + y0 + " A" + r + " " + r + " 0 " + (a1 - a0 > Math.PI ? 1 : 0) + " 1 " + x1 + " " + y1;
  }
  var A0 = -0.75 * Math.PI, A1 = 0.75 * Math.PI;
  bg.setAttribute("d", arc(A0, A1));
  var dragging = false, sy = 0, sv = 0, lastTap = 0;
  k.addEventListener("pointerdown", function (e) {
    e.preventDefault(); e.stopPropagation();
    var now = Date.now();
    if (opts && opts.def != null && now - lastTap < 300) { setParam(t, f, p, opts.def); lastTap = 0; return; }
    lastTap = now;
    dragging = true; sy = e.clientY; sv = pv(t, f, p);
    k.setPointerCapture(e.pointerId);
  });
  k.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    setParam(t, f, p, sv + (sy - e.clientY) / (e.shiftKey ? 800 : 200));
  });
  k.addEventListener("pointerup", function () { dragging = false; });
  k.addEventListener("pointercancel", function () { dragging = false; });
  k.addEventListener("wheel", function (e) { e.preventDefault(); setParam(t, f, p, pv(t, f, p) - e.deltaY / 2000); }, { passive: false });
  k.update = function () {
    var n = pv(t, f, p), a = A0 + (A1 - A0) * n;
    val.setAttribute("d", n > 0.002 ? arc(A0, a) : "");
    ptr.setAttribute("x2", 32 + 15 * Math.sin(a)); ptr.setAttribute("y2", 32 - 15 * Math.cos(a));
    var txt = fmtParam(t, f, p);
    kv.textContent = opts && opts.small ? txt.replace(/\s*dB$/, "") : txt;
  };
  return k;
}

// ---------------------------------------------------------------- FX popup
var popup = null;   // {t, f, kind, sel, knobs, cv, ...}
function openPopup(t, f) {
  var fx = getFx(t, f);
  if (!fx) return;
  popup = { t: t, f: f, kind: fx.k, sel: popup && popup.t === t && popup.f === f ? popup.sel : 0, sig: "" };
  $("modal").className = "open";
  updatePopup();
}
function closePopup() { popup = null; $("modal").className = ""; $("cardBody").innerHTML = ""; }
$("closeX").onclick = closePopup;
$("modal").addEventListener("pointerdown", function (e) { if (e.target === $("modal")) closePopup(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && popup) closePopup(); });
$("cardOn").onclick = function () { if (popup) toggleFx(popup.t, popup.f); };
$("cardFloat").onclick = function () { if (popup) bridgeCmd("o|" + popup.t + "|" + popup.f); };

function updatePopup() {
  var t = popup.t, f = popup.f, fx = getFx(t, f);
  if (!fx) { closePopup(); return; }
  var sig = t + "/" + f + "/" + fx.n + "/" + fx.p.length + "/" + popup.sel + "/" + (fx.bt ? fx.bt.join(",") : "");
  if (sig !== popup.sig) { popup.sig = sig; buildPopup(); }
  setTxt($("cardOn"), fx.e ? "ON" : "BYPASSED");
  setCls($("cardOn"), fx.e ? "on" : "");
  if (popup.kind === "eq") {
    popup.geom = drawEq(popup.cv, t, f, { big: true, sel: popup.sel });
    popup.chips.forEach(function (ch, b) { setCls(ch, "band" + (fx.be[b] == 1 ? "" : " off") + (b === popup.sel ? " sel" : "")); });
    if (popup.enBtn) {
      var on = fx.be[popup.sel] == 1;
      setTxt(popup.enBtn, on ? "Band on" : "Band off");
      setCls(popup.enBtn, on ? "on" : "");
    }
  } else if (popup.kind === "comp") {
    popup.geom = drawComp(popup.cv, t, f, { big: true });
    popup.toggles.forEach(function (b) { setCls(b, pv(t, f, b.p) > 0.5 ? "on" : ""); });
  } else {
    popup.sliders.forEach(function (o) {
      o.val.textContent = fmtParam(t, f, o.p);
      if (!o.drag) o.r.value = pv(t, f, o.p);
    });
  }
  (popup.knobs || []).forEach(function (k) { k.update(); });
}

function buildPopup() {
  var t = popup.t, f = popup.f, fx = getFx(t, f), body = $("cardBody");
  $("cardTitle").innerHTML = esc(fxShortName(fx.n)) + "<small>" + esc(trackName(t)) + "</small>";
  body.innerHTML = "";
  popup.knobs = [];
  if (popup.kind === "eq") buildEqPopup(body, t, f, fx);
  else if (popup.kind === "comp") buildCompPopup(body, t, f, fx);
  else buildGenericPopup(body, t, f, fx);
}

function graphColumn(body, square) {
  var col = el("div"); col.id = "graphCol";
  var box = el("div"); box.id = "graphBox";
  var cv = el("canvas"); cv.id = "graph";
  box.appendChild(cv); col.appendChild(box);
  if (square) { box.style.alignSelf = "flex-start"; box.style.width = "100%"; box.style.maxWidth = "440px"; cv.style.height = "auto"; cv.style.aspectRatio = "440 / 400"; }
  body.appendChild(col);
  var ctrl = el("div"); ctrl.id = "ctrlCol";
  body.appendChild(ctrl);
  popup.cv = cv;
  return { col: col, ctrl: ctrl, cv: cv };
}

function buildEqPopup(body, t, f, fx) {
  var g = graphColumn(body), nb = fx.bt.length;
  if (popup.sel >= nb) popup.sel = 0;
  // band chips above the graph
  var chips = el("div", "bands");
  popup.chips = [];
  for (var b = 0; b < nb; b++) (function (b) {
    var ch = el("button", "band", (b + 1) + " " + (EQ_SHORT[fx.bt[b]] || "?"));
    ch.style.borderColor = BAND_COLORS[b % 8];
    ch.onclick = function () { popup.sel = b; updatePopup(); };
    chips.appendChild(ch); popup.chips.push(ch);
  })(b);
  g.col.insertBefore(chips, g.col.firstChild);
  g.col.appendChild(el("div", "hint", "Drag a numbered point to set frequency and gain. Double-tap a point to switch the band on/off. Mouse wheel over a point changes its bandwidth."));

  // right column: selected band
  var sel = popup.sel, pf = 3 * sel;
  g.ctrl.appendChild(el("div", "sect", "Band " + (sel + 1)));
  var head = el("div", "ctrlhead");
  var typeSel = el("select");
  EQ_TYPES.forEach(function (ty) {
    var o = el("option", null, ty[1]); o.value = ty[0];
    if (ty[0] === fx.bt[sel] || (ty[0] === 8 && (fx.bt[sel] === 2 || fx.bt[sel] >= 9))) o.selected = true;
    typeSel.appendChild(o);
  });
  typeSel.onchange = function () {
    fx.bt[sel] = +typeSel.value;
    setPend("bt" + t + "/" + f + "/" + sel, fx.bt[sel]);
    bridgeCmd("y|" + t + "|" + f + "|" + sel + "|" + typeSel.value);
    updatePopup();
  };
  var en = el("button");
  en.onclick = function () { toggleBand(t, f, sel); };
  popup.enBtn = en;
  head.appendChild(typeSel); head.appendChild(en);
  g.ctrl.appendChild(head);
  var kn = el("div", "knobs"), col = BAND_COLORS[sel % 8];
  [["Frequency", pf, null], ["Gain", pf + 1, v2n(fx, pf + 1, 0)], ["Bandwidth", pf + 2, null]].forEach(function (a) {
    var k = makeKnob(a[0], t, f, a[1], { color: col, def: a[2] });
    kn.appendChild(k); popup.knobs.push(k);
  });
  g.ctrl.appendChild(kn);

  g.ctrl.appendChild(el("div", "sect", "Output"));
  var kn2 = el("div", "knobs");
  [["Global Gain", "#59b6ff", true], ["Wet", "#9aa3ad", false]].forEach(function (a) {
    var p = paramIndex(fx, a[0]);
    if (p < 0) return;
    var k = makeKnob(a[0] === "Global Gain" ? "Output gain" : a[0], t, f, p, { color: a[1], def: a[2] ? v2n(fx, p, 0) : 1 });
    kn2.appendChild(k); popup.knobs.push(k);
  });
  g.ctrl.appendChild(kn2);

  // graph interaction
  var drag = null, lastTap = { b: -1, t: 0 };
  function hit(e) {
    var r = g.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, best = -1, bd = 900;
    (popup.geom ? popup.geom.nodes : []).forEach(function (n) {
      var d = (n.x - x) * (n.x - x) + (n.y - y) * (n.y - y) + (n.on ? 0 : 60);
      if (d <= bd) { bd = d; best = n.b; }
    });
    return { b: best, x: x, y: y };
  }
  g.cv.addEventListener("pointerdown", function (e) {
    var h = hit(e);
    if (h.b < 0) return;
    e.preventDefault();
    var now = Date.now();
    if (lastTap.b === h.b && now - lastTap.t < 300) { toggleBand(t, f, h.b); lastTap.b = -1; return; }
    lastTap = { b: h.b, t: now };
    if (popup.sel !== h.b) { popup.sel = h.b; updatePopup(); }
    drag = { b: h.b };
    g.cv.setPointerCapture(e.pointerId);
  });
  g.cv.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var r = g.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, b = drag.b;
    var fxn = getFx(t, f);
    setParam(t, f, 3 * b, v2n(fxn, 3 * b, x2f(x, r.width)));
    if (hasGain(fxn.bt[b])) setParam(t, f, 3 * b + 1, v2n(fxn, 3 * b + 1, popup.geom.y2db(y)));
  });
  g.cv.addEventListener("pointerup", function () { drag = null; });
  g.cv.addEventListener("pointercancel", function () { drag = null; });
  g.cv.addEventListener("wheel", function (e) {
    var h = hit(e);
    if (h.b < 0) return;
    e.preventDefault();
    var p = 3 * h.b + 2;
    setParam(t, f, p, pv(t, f, p) + e.deltaY / 2000);
  }, { passive: false });
}
function toggleBand(t, f, b) {
  var fx = getFx(t, f);
  if (!fx) return;
  fx.be[b] = fx.be[b] == 1 ? 0 : 1;
  setPend("be" + t + "/" + f + "/" + b, fx.be[b]);
  bridgeCmd("e|" + t + "|" + f + "|" + b + "|" + fx.be[b]);
  onLocalChange(t, f);
}

function buildCompPopup(body, t, f, fx) {
  var g = graphColumn(body, true), cp = compParams(t, f), idx = cp.idx;
  g.col.appendChild(el("div", "hint", "Drag T along the line to set threshold, drag R up/down to set ratio. Red bar = live gain reduction."));
  g.ctrl.appendChild(el("div", "sect", "Dynamics"));
  var kn = el("div", "knobs"), COL = "#ffb347";
  [["Threshold", "Threshold", 0.5], ["Ratio", "Ratio", null], ["Knee", "Knee", 0], ["Attack", "Attack", null],
   ["Release", "Release", null], ["Pre-comp", "Pre-comp", 0]].forEach(function (a) {
    if (idx[a[1]] < 0) return;
    var k = makeKnob(a[0], t, f, idx[a[1]], { color: COL, def: a[2] });
    kn.appendChild(k); popup.knobs.push(k);
  });
  g.ctrl.appendChild(kn);
  g.ctrl.appendChild(el("div", "sect", "Mix / detector"));
  var kn2 = el("div", "knobs");
  [["Wet", "Wet", 0.5], ["Dry", "Dry", 0], ["RMS size", "RMS size", null]].forEach(function (a) {
    if (idx[a[1]] < 0) return;
    var k = makeKnob(a[0], t, f, idx[a[1]], { color: "#9aa3ad", def: a[2] });
    kn2.appendChild(k); popup.knobs.push(k);
  });
  g.ctrl.appendChild(kn2);
  var tg = el("div", "toggles");
  popup.toggles = [];
  [["Auto make-up", "Auto Make Up Gain"], ["Auto release", "Auto Release"]].forEach(function (a) {
    if (idx[a[1]] < 0) return;
    var b = el("button", null, a[0]);
    b.p = idx[a[1]];
    b.onclick = function () { setParam(t, f, b.p, pv(t, f, b.p) > 0.5 ? 0 : 1); };
    tg.appendChild(b); popup.toggles.push(b);
  });
  g.ctrl.appendChild(tg);

  // graph interaction
  var drag = null;
  g.cv.addEventListener("pointerdown", function (e) {
    var gm = popup.geom; if (!gm) return;
    var r = g.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var th = clamp(gm.cp.th, CMIN, CMAX), hx = gm.X(th), hy = gm.Y(th);
    var rx = gm.X(CMAX), ry = gm.Y(compOut(CMAX, gm.cp.th, gm.cp.ratio, gm.cp.knee));
    var dT = (x - hx) * (x - hx) + (y - hy) * (y - hy), dR = (x - rx) * (x - rx) + (y - ry) * (y - ry);
    if (Math.min(dT, dR) > 1600) return;
    e.preventDefault();
    drag = dT <= dR ? "T" : "R";
    g.cv.setPointerCapture(e.pointerId);
  });
  g.cv.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var gm = popup.geom, r = g.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    var fxn = getFx(t, f);
    if (drag === "T" && idx.Threshold >= 0) {
      var db = (gm.x2db(x) + gm.y2db(y)) / 2;   // project onto the diagonal
      setParam(t, f, idx.Threshold, db <= CMIN ? 0 : v2n(fxn, idx.Threshold, clamp(db, CMIN, CMAX)));
    } else if (drag === "R" && idx.Ratio >= 0) {
      var T = gm.cp.th, out = clamp(gm.y2db(y), T, CMAX);
      var ratio = out - T < 0.05 ? 1000 : (CMAX - T) / (out - T);
      setParam(t, f, idx.Ratio, v2n(fxn, idx.Ratio, clamp(ratio, 1, 1000)));
    }
  });
  g.cv.addEventListener("pointerup", function () { drag = null; });
  g.cv.addEventListener("pointercancel", function () { drag = null; });
}

function buildGenericPopup(body, t, f, fx) {
  var box = el("div"); box.id = "params";
  popup.sliders = [];
  fx.p.forEach(function (p, pi) {
    var row = el("div", "prm");
    var val = el("b");
    var r = el("input"); r.type = "range"; r.min = 0; r.max = 1; r.step = 0.001;
    r.oninput = function () { setParam(t, f, pi, +r.value); };
    row.appendChild(el("label", null, esc(dec(p[0])))); row.appendChild(val); row.appendChild(r);
    box.appendChild(row);
    var o = { p: pi, r: r, val: val };
    guardDrag(r, o);
    popup.sliders.push(o);
  });
  if (fx.np > fx.p.length) box.appendChild(el("div", "hint", "Showing first " + fx.p.length + " of " + fx.np + " parameters."));
  body.appendChild(box);
}

// canvases and fader caps are pixel-based: rebuild on resize
window.addEventListener("resize", function () { layoutSig = ""; if (popup) popup.sig = ""; render(); });
</script>
